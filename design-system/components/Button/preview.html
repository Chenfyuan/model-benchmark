<!doctype html>
<html>
<head><meta charset="utf-8"><title>Button — preview</title>
<style>body{margin:0;padding:20px;background:var(--bg);font-family:var(--font-sans);color:var(--ink)}.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}</style></head>
<body>
<div id="root"></div>
<script>
  var H = window.Heng, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div',{className:'row'},h(H.Button,{variant:'primary',icon:'plus'},'新建评测'),h(H.Button,null,'导出报告'),h(H.Button,{variant:'ghost',icon:'replay'},'重跑'),h(H.Button,{variant:'primary',loading:true},'提交中'),h(H.Button,{size:'sm'},'小按钮')));
</script>
</body>
</html>
