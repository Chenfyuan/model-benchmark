<!doctype html>
<html>
<head><meta charset="utf-8"><title>Sparkline — preview</title>
<style>body{margin:0;padding:20px;background:var(--bg);font-family:var(--font-sans);color:var(--ink)}.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}</style></head>
<body>
<div id="root"></div>
<script>
  var H = window.Heng, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div',{className:'row',style:{gap:'24px'}},['signal','teal','amber','coral'].map(function(t,i){return h('div',{key:t,style:{width:'180px'}},h(H.Sparkline,{tone:t,data:[[3,5,4,7,6,9,8,11],[9,8,9,10,11,10,12,13],[2,4,3,6,4,5,7,6],[10,9,10,8,7,8,6,5]][i]}))})));
</script>
</body>
</html>
